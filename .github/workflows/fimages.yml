name: Images des catégories de formations
on:
  workflow_dispatch:
    inputs:
      liste:
        description: 'JSON [[nom, url, crédit], …]'
        required: true
permissions: { contents: write }
jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet pillow
      - name: Télécharger et convertir
        env: { LISTE: '${{ github.event.inputs.liste }}' }
        run: python3 scripts/images/fetch.py
      - name: Enregistrer
        run: |
          git config user.name "Luisart Images"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/formations
          git diff --cached --quiet && { echo "Rien de nouveau"; exit 0; }
          git commit -m "Images des catégories de formations"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
