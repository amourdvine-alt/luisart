name: Créer l'index Firestore du robot de candidature
on: { workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Créer l'index « cand / st » (portée groupe de collections)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > /tmp/sa.json
          gcloud auth activate-service-account --key-file=/tmp/sa.json --quiet
          gcloud firestore indexes fields update st --collection-group=cand --project=luisart-21e0b \
            --index='order=ascending' --index='order=ascending,query-scope=collection-group' --quiet --async \
            && echo "Demande envoyée." || echo "::warning::Le compte du robot n'a pas le droit de créer l'index : créez-le depuis la console Firebase."
          rm -f /tmp/sa.json
