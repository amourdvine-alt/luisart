name: Vérifier les règles de sécurité (compte d'essai temporaire)
on: { workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  verif:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          K=$(grep -o "apiKey: *['\"][^'\"]*" firebase-config.js | sed "s/.*['\"]//")
          T=$(curl -sS -X POST "https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=$K" -H 'Content-Type: application/json' -d '{"returnSecureToken":true}')
          TOK=$(echo "$T" | jq -r .idToken); U=$(echo "$T" | jq -r .localId); B="https://firestore.googleapis.com/v1/projects/luisart-21e0b/databases/(default)/documents"
          ok=1; t(){ r=$(eval "$2"); if [ "$r" = "$3" ]; then echo "OK   $1 ($r)"; else echo "ÉCHEC $1 : $r au lieu de $3"; ok=0; fi; }
          t "compte ordinaire : créer un certificat refusé" "curl -s -o /dev/null -w '%{http_code}' -X PATCH -H 'Authorization: Bearer $TOK' -H 'Content-Type: application/json' '$B/certs/test_$U' -d '{\"fields\":{\"aid\":{\"stringValue\":\"$U\"},\"num\":{\"stringValue\":\"CA-TEST\"}}}'" 403
          t "lecture publique des certificats" "curl -s -o /dev/null -w '%{http_code}' '$B/certs?pageSize=1'" 200
          t "lecture publique des œuvres" "curl -s -o /dev/null -w '%{http_code}' '$B/works?pageSize=1'" 200
          t "écrire son historique de lives" "curl -s -o /dev/null -w '%{http_code}' -X PATCH -H 'Authorization: Bearer $TOK' -H 'Content-Type: application/json' '$B/data/users/$U/lvlog' -d '{\"fields\":{\"up\":{\"integerValue\":\"1\"}}}'" 200
          t "lire l'historique d'un autre compte refusé" "curl -s -o /dev/null -w '%{http_code}' '$B/data/users/$U/lvlog'" 403
          T2=$(curl -sS -X POST "https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=$K" -H 'Content-Type: application/json' -d '{"returnSecureToken":true}')
          TOK2=$(echo "$T2" | jq -r .idToken); U2=$(echo "$T2" | jq -r .localId); M=essai_$U; W=essai_$U
          J='Content-Type: application/json'
          t "envoyer un message" "curl -s -o /dev/null -w '%{http_code}' -X PATCH -H 'Authorization: Bearer $TOK' -H '$J' '$B/dm/$M' -d '{\"fields\":{\"from\":{\"stringValue\":\"$U\"},\"to\":{\"stringValue\":\"$U2\"},\"text\":{\"stringValue\":\"Bonjour\"},\"of\":{\"mapValue\":{\"fields\":{\"amt\":{\"integerValue\":\"50000\"},\"wid\":{\"stringValue\":\"w1\"},\"st\":{\"stringValue\":\"att\"}}}}}}'" 200
          t "destinataire : réécrire le message refusé" "curl -s -o /dev/null -w '%{http_code}' -X PATCH -H 'Authorization: Bearer $TOK2' -H '$J' '$B/dm/$M?updateMask.fieldPaths=text' -d '{\"fields\":{\"text\":{\"stringValue\":\"Faux\"}}}'" 403
          t "destinataire : baisser le prix de l'offre refusé" "curl -s -o /dev/null -w '%{http_code}' -X PATCH -H 'Authorization: Bearer $TOK2' -H '$J' '$B/dm/$M?updateMask.fieldPaths=of' -d '{\"fields\":{\"of\":{\"mapValue\":{\"fields\":{\"amt\":{\"integerValue\":\"1\"},\"wid\":{\"stringValue\":\"w1\"},\"st\":{\"stringValue\":\"ok\"}}}}}}'" 403
          t "destinataire : accepter l'offre" "curl -s -o /dev/null -w '%{http_code}' -X PATCH -H 'Authorization: Bearer $TOK2' -H '$J' '$B/dm/$M?updateMask.fieldPaths=of' -d '{\"fields\":{\"of\":{\"mapValue\":{\"fields\":{\"amt\":{\"integerValue\":\"50000\"},\"wid\":{\"stringValue\":\"w1\"},\"st\":{\"stringValue\":\"ok\"}}}}}}'" 200
          t "expéditeur : changer le prix après acceptation refusé" "curl -s -o /dev/null -w '%{http_code}' -X PATCH -H 'Authorization: Bearer $TOK' -H '$J' '$B/dm/$M?updateMask.fieldPaths=of' -d '{\"fields\":{\"of\":{\"mapValue\":{\"fields\":{\"amt\":{\"integerValue\":\"99000\"},\"wid\":{\"stringValue\":\"w1\"},\"st\":{\"stringValue\":\"ok\"}}}}}}'" 403
          t "destinataire : réagir au message" "curl -s -o /dev/null -w '%{http_code}' -X PATCH -H 'Authorization: Bearer $TOK2' -H '$J' '$B/dm/$M?updateMask.fieldPaths=re' -d '{\"fields\":{\"re\":{\"mapValue\":{}}}}'" 200
          t "expéditeur : corriger son message" "curl -s -o /dev/null -w '%{http_code}' -X PATCH -H 'Authorization: Bearer $TOK' -H '$J' '$B/dm/$M?updateMask.fieldPaths=text' -d '{\"fields\":{\"text\":{\"stringValue\":\"Bonsoir\"}}}'" 200
          t "publier une œuvre en attente de validation" "curl -s -o /dev/null -w '%{http_code}' -X PATCH -H 'Authorization: Bearer $TOK' -H '$J' '$B/works/$W' -d '{\"fields\":{\"aid\":{\"stringValue\":\"$U\"},\"title\":{\"stringValue\":\"Essai\"},\"pend\":{\"booleanValue\":true}}}'" 200
          t "auteur : lever soi-même la validation refusé" "curl -s -o /dev/null -w '%{http_code}' -X PATCH -H 'Authorization: Bearer $TOK' -H '$J' '$B/works/$W?updateMask.fieldPaths=pend' -d '{\"fields\":{\"pend\":{\"booleanValue\":false}}}'" 403
          t "auteur : modifier le titre" "curl -s -o /dev/null -w '%{http_code}' -X PATCH -H 'Authorization: Bearer $TOK' -H '$J' '$B/works/$W?updateMask.fieldPaths=title' -d '{\"fields\":{\"title\":{\"stringValue\":\"Essai 2\"}}}'" 200
          t "autre compte : modifier l'œuvre refusé" "curl -s -o /dev/null -w '%{http_code}' -X PATCH -H 'Authorization: Bearer $TOK2' -H '$J' '$B/works/$W?updateMask.fieldPaths=title' -d '{\"fields\":{\"title\":{\"stringValue\":\"Pirate\"}}}'" 403
          curl -s -o /dev/null -X DELETE -H "Authorization: Bearer $TOK" "$B/dm/$M"; curl -s -o /dev/null -X DELETE -H "Authorization: Bearer $TOK" "$B/works/$W"
          curl -s -o /dev/null -X POST "https://identitytoolkit.googleapis.com/v1/accounts:delete?key=$K" -H 'Content-Type: application/json' -d "{\"idToken\":\"$TOK2\"}"
          curl -s -o /dev/null -X DELETE -H "Authorization: Bearer $TOK" "$B/data/users/$U/lvlog"
          curl -s -o /dev/null -X POST "https://identitytoolkit.googleapis.com/v1/accounts:delete?key=$K" -H 'Content-Type: application/json' -d "{\"idToken\":\"$TOK\"}"; echo "compte d'essai supprimé"
          [ $ok = 1 ]
