name: Télécharger la musique libre de la galerie
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: python3 scripts/music-fetch.py
      - name: Enregistrer
        run: |
          git config user.name "luisart-robot"; git config user.email "robot@users.noreply.github.com"
          git add music && git commit -m "Musique libre de la galerie" && git pull --rebase && git push || echo rien
