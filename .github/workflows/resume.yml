name: Résumés IA Luisart
# Une IA libre (Qwen 2.5 7B, licence Apache 2.0) résume en français chaque actualité et chaque appel.
# Plusieurs copies travaillent en même temps ; chaque annonce n'est résumée qu'une seule fois.
on:
  workflow_run:
    workflows: ['Veille actualités Luisart']
    types: [completed]
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: resume
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      parts: ${{ steps.p.outputs.parts }}
      n: ${{ steps.p.outputs.n }}
    steps:
      - uses: actions/checkout@v5
      - id: p
        run: |
          N=$(node -e "
            const fs=require('fs'),c=require('crypto');const d=JSON.parse(fs.readFileSync('data/news-auto.json'));let k={};try{k=JSON.parse(fs.readFileSync('data/resumes.json'))}catch{}
            const key=x=>c.createHash('sha1').update((x.title||'')+'|'+(x.link||'')).digest('hex').slice(0,12);
            const t=d.items.filter(x=>x.link&&!/news\.google\./.test(x.link)&&!(k[x.id]&&k[x.id].k===key(x)&&(k[x.id].r||(k[x.id].fail||0)>=3))).length;
            console.log(Math.min(8,Math.ceil(t/5)))")
          echo "À résumer → $N robot(s)"
          echo "n=$N" >> $GITHUB_OUTPUT
          echo "parts=$(node -e "console.log(JSON.stringify([...Array($N).keys()]))")" >> $GITHUB_OUTPUT
  resume:
    needs: plan
    if: needs.plan.outputs.n != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJson(needs.plan.outputs.parts) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: Installer llama.cpp
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          U=$(gh api 'repos/ggml-org/llama.cpp/releases?per_page=10' --jq '.[].assets[].browser_download_url' | grep -E 'bin-ubuntu-x64\.(zip|tar\.gz)$' | head -1); echo "-> $U"
          mkdir -p /tmp/l && cd /tmp/l
          if [ -n "$U" ]; then curl -sSL -o pkg "$U" && (unzip -q pkg 2>/dev/null || tar xzf pkg); fi
          if ! find . -name llama-server -type f | grep -q .; then
            git clone -q --depth 1 https://github.com/ggml-org/llama.cpp src && cmake -S src -B b -DLLAMA_CURL=OFF >/dev/null && cmake --build b -j $(nproc) --target llama-server >/dev/null
          fi
          find . -name llama-server -type f | head -1 > /tmp/srvpath
      - name: Télécharger l'IA (Qwen 2.5 7B)
        run: curl -sSL --retry 3 -o /tmp/m.gguf https://huggingface.co/bartowski/Qwen2.5-7B-Instruct-GGUF/resolve/main/Qwen2.5-7B-Instruct-Q4_K_M.gguf
      - name: Résumer
        env: { PART: '${{ matrix.part }}', NPARTS: '${{ needs.plan.outputs.n }}', MAX_MIN: 45 }
        run: |
          S=$(cat /tmp/srvpath); LD_LIBRARY_PATH=/tmp/l/$(dirname $S):$LD_LIBRARY_PATH nohup /tmp/l/$S -m /tmp/m.gguf -c 4096 -t $(nproc) --port 8080 --jinja > /tmp/srv.log 2>&1 &
          for i in $(seq 1 120); do curl -sf localhost:8080/health >/dev/null && break; sleep 2; done
          node scripts/resume/resume.mjs
      - uses: actions/upload-artifact@v4
        with: { name: 'resumes-${{ matrix.part }}', path: out/, retention-days: 2 }
  enregistrer:
    needs: [plan, resume]
    if: always() && needs.plan.outputs.n != '0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - uses: actions/download-artifact@v4
        with: { path: parts, pattern: 'resumes-*' }
      - name: Enregistrer les résumés
        run: |
          git config user.name "Luisart Résumés"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4; do
            git pull --rebase -q || true
            node scripts/resume/merge.mjs
            git add data/resumes.json data/news-auto.json
            if git diff --cached --quiet; then echo "Rien de nouveau"; exit 0; fi
            git commit -qm "Résumés IA du $(date -u +%Y-%m-%d)" && git push && exit 0
            git reset -q --hard origin/main; sleep 8
          done
