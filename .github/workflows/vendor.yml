name: Copier les bibliothèques (3D + live) sur le site
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          mkdir -p vendor
          curl -fsSL -o vendor/three.min.js https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js
          head -c 120 vendor/three.min.js; echo; wc -c vendor/three.min.js
          T=$(mktemp -d); (cd $T && npm pack agora-rtc-sdk-ng@4.22.0 >/dev/null && tar xzf agora-rtc-sdk-ng-*.tgz)
          M=$(node -e "const p=require('$T/package/package.json');console.log(p.browser&&typeof p.browser=='string'?p.browser:p.main)")
          echo "SDK Agora : $M"; ls $T/package
          cp "$T/package/$M" vendor/agora.js; wc -c vendor/agora.js; grep -c "AgoraRTC" vendor/agora.js
          git config user.name "luisart-robot"; git config user.email "robot@users.noreply.github.com"
          git add vendor && git commit -m "Bibliothèque 3D hébergée sur le site" && git pull --rebase && git push || echo rien
