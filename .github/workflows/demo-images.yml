name: Télécharger les images de la démo
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Télécharger
        run: |
          mkdir -p demo-src
          python3 - <<'PY'
          import json,urllib.request
          for it in json.load(open('scripts/demo-fetch.json')):
              for u in it['u']:
                  try:
                      d=urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'}),timeout=60).read()
                      if len(d)>2000:
                          open('demo-src/'+it['n']+'.png','wb').write(d);print(it['n'],len(d),u[:60]);break
                  except Exception as e: print(it['n'],'échec',str(e)[:80])
          PY
      - name: Enregistrer
        run: |
          git config user.name "luisart-robot"; git config user.email "robot@users.noreply.github.com"
          git add demo-src && git commit -m "Images sources de la démo" && git push || echo rien
