name: Veille actualités Luisart
on:
  schedule:
    - cron: '17 5 * * *'    # chaque jour vers 5 h 17 (heure d'Abidjan)
    - cron: '17 15 * * *'   # et vers 15 h 17
  workflow_dispatch: {}      # bouton « Run workflow » pour lancer à la main
permissions:
  contents: write
concurrency:
  group: veille
  cancel-in-progress: false
jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Chercher les actualités
        run: node scripts/veille.mjs
      - name: Enregistrer
        run: |
          git config user.name "Luisart Veille"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news-auto.json
          if git diff --cached --quiet; then echo "Rien de nouveau"; exit 0; fi
          git commit -m "Veille : actualités du $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
